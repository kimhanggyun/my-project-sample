name: deploy-cloudrun

# 게임 서버를 Google Cloud Run에 올린다 (docs/impl/deploy-cloudrun.md).
# main에 합치면 자동 배포 (서버에 영향 있는 경로가 바뀔 때만, 2026-11-15 사용자 결정). 손으로도 실행 가능 (Actions 탭 → Run workflow).
# 배포 전에 테스트(core-tests와 같은 dotnet test)를 돌리고, 실패하면 배포하지 않는다.
# 저장소 설정 → Secrets and variables → Actions → Variables에 아래 값이 있어야 한다 (비밀값 없음: 키 대신 Workload Identity 사용).
#   GCP_PROJECT_ID, GCP_REGION(asia-northeast3), GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT(배포용), GCP_RUNTIME_SA(서버 실행용), GCS_BUCKET, FIREBASE_PROJECT_ID
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'GameCore.sln'
      - '.github/workflows/deploy-cloudrun.yml'
  workflow_dispatch:

# 배포는 한 번에 하나씩 (인스턴스 1대 · 버킷 저장소). 뒤에 온 배포는 앞 배포가 끝날 때까지 기다린다.
concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    # core-tests.yml과 같은 검사. 실패한 커밋은 배포하지 않는다 (deploy needs test).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore GameCore.sln
      - name: Build
        run: dotnet build GameCore.sln --no-restore -c Release
      - name: Test
        run: dotnet test GameCore.sln --no-build -c Release

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    env:
      REGION: ${{ vars.GCP_REGION || 'asia-northeast3' }}
      SERVICE: game-server
      IMAGE: ${{ vars.GCP_REGION || 'asia-northeast3' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/game/game-server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f server/Game.Server/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy
        # 결제 영수증 검증기 (R-114 · R-116, deploy-cloudrun.md 7장): 저장소 변수 RECEIPT_VERIFIER (기본 off = 모두 거절, googlePlay = 실제 검증).
        # googlePlay면 서비스 계정 키를 Secret Manager 비밀(GOOGLE_PLAY_SA_SECRET, 기본 google-play-service-account)에서 붙인다 — 키는 저장소 · 워크플로에 없다.
        env:
          RECEIPT_VERIFIER: ${{ vars.RECEIPT_VERIFIER || 'off' }}
          GOOGLE_PLAY_PACKAGE: ${{ vars.GOOGLE_PLAY_PACKAGE }}
          GOOGLE_PLAY_SA_SECRET: ${{ vars.GOOGLE_PLAY_SA_SECRET || 'google-play-service-account' }}
        # 테스트 단계: 인스턴스 1대(폴더 저장소를 Cloud Storage 버킷에 붙여 쓰므로 동시에 2대 이상 쓰면 안 된다), 요청 없으면 0대.
        # uid/gid 1654 = .NET 이미지의 app 사용자 (버킷 폴더에 쓸 수 있게).
        run: |
          EXTRA=()
          if [ "$RECEIPT_VERIFIER" = "googlePlay" ]; then EXTRA+=(--set-secrets "Game__GooglePlay__ServiceAccountJson=${GOOGLE_PLAY_SA_SECRET}:latest"); fi
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --min-instances 0 \
            --max-instances 1 \
            --execution-environment gen2 \
            --add-volume "name=store,type=cloud-storage,bucket=${{ vars.GCS_BUCKET }},mount-options=uid=1654;gid=1654" \
            --add-volume-mount "volume=store,mount-path=/data/store" \
            --set-env-vars "^|^Game__Firebase__ProjectId=${{ vars.FIREBASE_PROJECT_ID }}|Game__AllowFakeReceipts=false|Game__Masters=${{ vars.GAME_MASTERS }}|Game__AdminKey=${{ secrets.GAME_ADMIN_KEY }}|Game__AdminGoogle=${{ vars.ADMIN_GOOGLE || 'off' }}|Game__ReceiptVerifier=${RECEIPT_VERIFIER}|Game__GooglePlay__PackageName=${GOOGLE_PLAY_PACKAGE}" \
            "${EXTRA[@]}"
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          echo "서버 주소: $URL"
          curl -sf "$URL/v1/time"
