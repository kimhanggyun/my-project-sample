name: nas-server

# NAS(32비트 ARM 리눅스, 예: ASUSTOR AS1004T)용 테스트 서버 묶음 (deploy/nas/README.md).
# main에 서버·규칙·데이터가 바뀌면, 또는 Actions 화면에서 직접 실행하면 game-server-nas 묶음을 만든다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', 'src/**', 'data/**', 'deploy/nas/**']

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish (linux-arm, self-contained)
        run: dotnet publish server/Game.Server -c Release -r linux-arm --self-contained true -o out/game-server-nas/app
      - name: Package
        run: |
          cp -r data out/game-server-nas/data
          cp deploy/nas/*.sh out/game-server-nas/
          chmod +x out/game-server-nas/*.sh
          tar -czf game-server-nas.tar.gz -C out game-server-nas
      - uses: actions/upload-artifact@v4
        with:
          name: game-server-nas
          path: game-server-nas.tar.gz
          retention-days: 30
